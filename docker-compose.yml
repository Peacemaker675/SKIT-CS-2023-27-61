services:
  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
      target: prod
    # nginx serves the React build and proxies /api + /socket.io to backend.
    # Host port 3000 matches the CORS / SocketIO origin in backend/app/extensions.py
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
      target: dev
    env_file: .env
    environment:
      FLASK_APP: app
      # Container hostnames override the localhost values in .env
      POSTGRES_HOST: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      INFLUX_HOST: http://influxdb:8181
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      influxdb:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  influxdb:
    image: influxdb:3.12.0-core
    # --without-auth is for local development only; use an admin token in prod.
    command:
      - influxdb3
      - serve
      - --node-id=node0
      - --object-store=file
      - --data-dir=/var/lib/influxdb3/data
      - --http-bind=0.0.0.0:8181
      - --without-auth
    ports:
      - "8181:8181"
    volumes:
      - influx_data:/var/lib/influxdb3/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  influx_data:
