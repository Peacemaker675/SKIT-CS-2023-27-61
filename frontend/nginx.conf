server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's DNS. With a variable in proxy_pass nginx re-resolves "backend"
    # per request, so a recreated backend container (new IP) doesn't give 502s.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:5000;

    # API -> Flask (same origin, so the JWT cookies are first-party)
    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Flask-SocketIO (websocket upgrade)
    location /socket.io/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # React Router: serve index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
